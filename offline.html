<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d46">
<title>Viva · Sem conexão</title>
<style>
:root{color-scheme:light dark;--bg:#faf8f3;--card:#fff;--ink:#2d3330;--forest:#2f5d46;--line:#e8e2d5}
@media(prefers-color-scheme:dark){:root{--bg:#171b18;--card:#20261f;--ink:#ecefe9;--forest:#a8d1b3;--line:#333b32}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:430px;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--card)}h1{color:var(--forest);font:600 2rem Georgia,serif;margin:0 0 16px}p{margin:0 0 16px}a{display:inline-block;background:var(--forest);color:var(--bg);border-radius:14px;padding:12px 18px;text-decoration:none;font-weight:600}a:focus-visible{outline:3px solid var(--forest);outline-offset:4px}
</style>
</head>
<body><main><h1>Viva</h1><p>Não foi possível conectar.</p><p>Conecte-se à internet para abrir sua conta e carregar ou salvar seus registros. Esta tela não guarda registros para enviar depois.</p><a href="./">Tentar novamente</a></main></body>
</html>
