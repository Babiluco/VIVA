<style>
/* =====================================================================
   VIVA · Soft Wellness — sistema de temas
   1) TOKENS: toda cor do app mora aqui (claro e escuro).
   2) Componentes só usam var(--token). Nenhuma cor fixa abaixo desta seção.
   O tema é escolhido por <html data-theme="light|dark"> (ver script no <head>).
   ===================================================================== */
:root{
  color-scheme:light;
  /* superfícies e texto */
  --background:#F6F7F2;--foreground:#243329;
  --card:#FFFFFF;--card-foreground:#243329;
  --surface-secondary:#EDF1E9;
  --muted:#EDF1E9;--muted-foreground:#58675D;
  /* marca */
  --primary:#426B52;--primary-foreground:#FFFFFF;
  --secondary:#DCEBDD;--secondary-foreground:#243329;
  --accent:#A75F43;
  /* bordas, campos e foco */
  --border:#DDE4DA;--input:#FFFFFF;--input-border:#7C8D81;--ring:#426B52;
  /* feedback (sem vermelho para peso ou metas não concluídas) */
  --success:#2F6B45;--warning:#8A5A00;--warning-foreground:#FFFFFF;--destructive:#A8412F;--destructive-foreground:#FFFFFF;
  /* progresso e gráficos */
  --progress-track:#DCEBDD;--progress-indicator:#4F8061;
  --chart-1:#4F8061;--chart-2:#A75F43;--chart-3:#4A6FA5;--chart-4:#8A6D1F;
  --chart-goal:#426B52;--chart-grid:#DDE4DA;--chart-axis:#58675D;
  /* navegação e seleção */
  --sidebar-background:#FFFFFF;--sidebar-foreground:#58675D;
  --selected:#426B52;--selected-foreground:#FFFFFF;
  /* elevação */
  --shadow:0 4px 20px rgba(36,51,41,.08);--overlay:rgba(20,26,22,.5);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:#141A16;--foreground:#F0F4EE;
  --card:#202B23;--card-foreground:#F0F4EE;
  --surface-secondary:#29372C;
  --muted:#29372C;--muted-foreground:#B7C4B8;
  --primary:#A9D0AF;--primary-foreground:#141A16;
  --secondary:#304A37;--secondary-foreground:#F0F4EE;
  --accent:#E5AC8F;
  --border:#38463B;--input:#202B23;--input-border:#7E967F;--ring:#A9D0AF;
  --success:#91C49C;--warning:#E6C27A;--warning-foreground:#141A16;--destructive:#F0907A;--destructive-foreground:#141A16;
  --progress-track:#304A37;--progress-indicator:#91C49C;
  --chart-1:#91C49C;--chart-2:#E5AC8F;--chart-3:#8FB4E3;--chart-4:#D9BC6A;
  --chart-goal:#A9D0AF;--chart-grid:#38463B;--chart-axis:#B7C4B8;
  --sidebar-background:#19221C;--sidebar-foreground:#B7C4B8;
  --selected:#A9D0AF;--selected-foreground:#141A16;
  --shadow:0 4px 20px rgba(0,0,0,.28);--overlay:rgba(0,0,0,.6);
}
:root{--r:20px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--background);color:var(--foreground);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
::selection{background:var(--secondary);color:var(--foreground)}
::placeholder{color:var(--muted-foreground);opacity:1}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--primary)}
h1{font-size:1.7rem;line-height:1.2}h3{font-size:.95rem;font-weight:700;margin-bottom:12px}
.ct{font:700 .95rem 'DM Sans',system-ui,sans-serif;color:var(--card-foreground);margin-bottom:12px}
.quote{font:500 1.05rem 'Fraunces',Georgia,serif;color:var(--muted-foreground);margin-top:6px}
.sub{color:var(--muted-foreground);font-size:.9rem}.big{font:600 1.8rem 'Fraunces',serif;color:var(--primary)}
.ok{color:var(--success);font-weight:700}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:60;background:var(--primary);color:var(--primary-foreground);border:0;border-radius:12px;padding:10px 16px;font:inherit}.skip:focus{left:8px}

/* ---------- layout e navegação ---------- */
.app{display:flex;min-height:100%}
.side{display:none;width:230px;padding:28px 16px;background:var(--sidebar-background);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;flex-direction:column;gap:4px}
.side-foot{margin-top:auto;padding:12px 4px 0}
.logo{font:600 1.7rem 'Fraunces',serif;color:var(--primary);padding:0 12px 20px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--sidebar-foreground);text-decoration:none;font-weight:500;border:0;background:none;font-size:inherit;font-family:inherit;cursor:pointer;transition:background .15s,color .15s}
.nav:hover{background:var(--surface-secondary);color:var(--foreground)}
.nav:active{transform:scale(.98)}
.nav.on{background:var(--secondary);color:var(--primary);font-weight:700;box-shadow:inset 3px 0 0 var(--primary)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;padding:24px 18px 110px;max-width:1000px;margin:0 auto;width:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--sidebar-background);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bottom .nav{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px}
.bottom .nav.on{box-shadow:inset 0 3px 0 var(--primary)}
.noauth .side,.noauth .bottom{display:none!important}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px}
.grid.sm{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.grid.sm .card{padding:16px}
.row{display:flex;align-items:center;gap:14px;justify-content:space-between}
.auth{max-width:380px;margin:8vh auto 0}

/* ---------- cards ---------- */
.card{background:var(--card);color:var(--card-foreground);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card.wide{grid-column:1/-1}
.lk{display:block;color:inherit;text-decoration:none;border-radius:var(--r)}.lk.wide{grid-column:1/-1}
.lk .card{height:100%;transition:transform .15s,border-color .15s}.lk:hover .card{transform:translateY(-2px);border-color:var(--primary)}.lk:active .card{transform:none}
.li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}.li:last-child{border:0}
.badge{text-align:center}.badge .em{font-size:2rem}.badge b{display:block;margin:6px 0 2px}.badge .sub{font-size:.78rem}
.badge.locked .em{filter:grayscale(1);opacity:.55}.badge.locked b{color:var(--muted-foreground)}

/* ---------- botões ---------- */
.btn{border:0;border-radius:14px;padding:11px 18px;font:500 .95rem inherit;font-family:inherit;cursor:pointer;background:var(--primary);color:var(--primary-foreground);transition:filter .15s,transform .1s,background .15s}
.btn:hover{filter:brightness(.92)}
.btn:active{transform:translateY(1px);filter:brightness(.86)}
.btn.soft{background:var(--secondary);color:var(--primary)}
.btn.soft:hover{background:var(--surface-secondary);filter:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.btn.sm{padding:5px 12px!important;font-size:.78rem!important;margin-top:8px;min-height:32px}
.gb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.gb .btn{padding:7px 12px;font-size:.8rem}
.lnkb{background:none;border:0;color:var(--primary);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer;text-align:left;padding:6px 0}
body.busy{cursor:progress}body.busy .btn,body.busy .emo{opacity:.6;pointer-events:none}

/* ---------- campos de formulário ---------- */
.field{display:block;margin-bottom:14px;font-size:.85rem;color:var(--muted-foreground)}
.field input,.field select,.exr input{background:var(--input);color:var(--foreground);border:1px solid var(--input-border);font:inherit}
.field input,.field select{display:block;width:100%;margin-top:4px;padding:12px 14px;border-radius:14px}
.field input:hover,.field select:hover,.exr input:hover{border-color:var(--foreground)}
.field input[aria-invalid=true],.field select[aria-invalid=true],.exr input[aria-invalid=true]{border-color:var(--destructive);box-shadow:0 0 0 1px var(--destructive)}
.field input:disabled,.field select:disabled{background:var(--surface-secondary);color:var(--muted-foreground);cursor:not-allowed}
select option{background:var(--card);color:var(--foreground)}
textarea{font:inherit}
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.chk:last-child{border:0}
.chk input{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--input-border);background:var(--input);flex:none;display:grid;place-items:center;cursor:pointer}
.chk:hover input:not(:checked){border-color:var(--primary)}
.chk input:checked{background:var(--primary);border-color:var(--primary)}.chk input:checked::after{content:"✓";color:var(--primary-foreground);font-size:14px}
.chk.done span{text-decoration:line-through;color:var(--muted-foreground)}
.hrow{border-radius:12px;padding-left:4px;padding-right:4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;background:var(--card);color:var(--foreground);border:1px solid var(--input-border);border-radius:99px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--primary);background:var(--surface-secondary)}
.pill input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pill:has(input:focus-visible){outline:3px solid var(--ring);outline-offset:2px}
.pill:has(input:checked),.pill[aria-pressed=true]{background:var(--selected);color:var(--selected-foreground);border-color:var(--selected)}
.pill:has(input:checked)::before,.pill[aria-pressed=true]::before{content:"✓ "}
.days{display:flex;gap:8px;overflow-x:auto;padding:6px}
.dy{flex:none;min-width:56px;border:1px solid var(--input-border);background:var(--card);color:var(--foreground);border-radius:14px;padding:8px 10px;font:inherit;font-size:.78rem;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.dy:hover{border-color:var(--primary);background:var(--surface-secondary)}
.dy.on{background:var(--selected);color:var(--selected-foreground);border-color:var(--selected);font-weight:700}
.emos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.emo{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface-secondary);color:var(--foreground);border-radius:16px;padding:10px 2px;font:inherit;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.emo:hover{transform:translateY(-2px);background:var(--secondary);border-color:var(--primary)}.emo:active{transform:scale(.97)}
.emo small{font-size:.68rem;text-align:center;line-height:1.15}
.wkrow{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;padding:12px 8px;border:0;border-bottom:1px solid var(--border);border-radius:10px;background:none;color:var(--foreground);font:inherit;text-align:left;cursor:pointer}
.wkrow:last-child{border-bottom:0}.wkrow:hover{background:var(--surface-secondary)}

/* ---------- seletor de tema ---------- */
.tsw{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--input-border);border-radius:99px;background:var(--card)}
.tsw button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted-foreground);border-radius:99px;padding:7px 12px;font:inherit;font-size:.85rem;cursor:pointer;transition:background .15s,color .15s}
.tsw button:hover{background:var(--surface-secondary);color:var(--foreground)}
.tsw button[aria-pressed=true],.tsw button[aria-pressed=true]:hover{background:var(--selected);color:var(--selected-foreground)}
.tsw.compact button{padding:7px}.tsw .ic{width:18px;height:18px}

/* ---------- progresso e gráficos ---------- */
.prog{height:8px;background:var(--progress-track);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.prog i{display:block;height:100%;background:var(--progress-indicator);border-radius:99px;transition:width .4s}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--chart-axis);display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px;position:relative}
.bars i{display:block;background:var(--chart-1);border-radius:8px 8px 4px 4px;min-height:4px}
.bars .hi{color:var(--foreground);font-weight:700}.bars .hi i{background:var(--primary)}
.bars div[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:-4px;left:50%;transform:translate(-50%,-100%);background:var(--foreground);color:var(--background);font-size:.75rem;font-weight:500;line-height:1.3;padding:4px 8px;border-radius:8px;white-space:nowrap;z-index:10;pointer-events:none}
.chart{display:block;width:100%;max-width:460px;margin:0 auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal span,.cal button{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:.8rem;border:0;background:none;color:var(--foreground);font-family:inherit}
.cal .hd{aspect-ratio:auto;color:var(--muted-foreground);font-size:.75rem}
.cal .tr{background:var(--progress-indicator);color:var(--primary-foreground);font-weight:700;cursor:pointer}
.cal .tr:hover{filter:brightness(.92)}
.cal .tr.on{background:var(--selected);color:var(--selected-foreground);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--selected)}
.cal .td{outline:2px solid var(--ring);outline-offset:-2px}
.cal .fut{color:var(--muted-foreground)}

/* ---------- timeline, etiquetas, exercícios ---------- */
.tl .it{display:grid;grid-template-columns:52px 1fr;gap:10px;padding-bottom:16px}
.tl .tm{font-weight:700;color:var(--primary);font-size:.9rem}
.tl .bd{border-left:2px solid var(--border);padding-left:16px;position:relative}
.tl .bd::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--chart-1)}
.tl img{display:block;width:84px;height:84px;object-fit:cover;border-radius:14px;margin-top:8px;border:1px solid var(--border)}
.tl .up b,.tl .up .sub{color:var(--muted-foreground)}.tl .up b{font-style:italic}
.tag{display:inline-block;background:var(--secondary);color:var(--primary);border-radius:99px;padding:2px 10px;font-size:.75rem;margin:6px 6px 0 0}
.exr{background:var(--surface-secondary);border-radius:16px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.exr input{width:100%;padding:10px 12px;border-radius:12px;font-size:.9rem}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- janelas e avisos ---------- */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);box-shadow:var(--shadow);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:24px;max-height:90%;overflow:auto}
@media(min-width:700px){.ov{align-items:center}.modal{border-radius:24px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--primary);color:var(--primary-foreground);padding:12px 20px;border-radius:22px;z-index:30;box-shadow:var(--shadow);font-size:.9rem;width:max-content;max-width:min(92vw,440px);text-align:center}
.toast.err{background:var(--destructive);color:var(--destructive-foreground)}
.toast.warn{background:var(--warning);color:var(--warning-foreground)}
.achp{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--card);color:var(--card-foreground);border:1px solid var(--primary);box-shadow:var(--shadow);border-radius:20px;padding:14px 22px 14px 18px;display:flex;gap:14px;align-items:center;z-index:40;animation:achin .5s cubic-bezier(.2,1.4,.4,1);cursor:pointer;width:max-content;max-width:min(92vw,440px)}
.achp .ae{font-size:2rem;animation:achb 1s ease .3s 2}
.achp .sp{position:absolute;left:36px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--chart-1);animation:achs .9s ease-out .2s both}

/* ---------- animações discretas ---------- */
@keyframes pop{0%{transform:scale(.97);background:var(--surface-secondary)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes ckp{50%{transform:scale(1.3)}}
.hrow.pop{animation:pop .45s ease}.hrow.pop input{animation:ckp .35s}
@keyframes achin{from{opacity:0;transform:translate(-50%,-30px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes achb{50%{transform:scale(1.3) rotate(-8deg)}}
@keyframes achs{from{opacity:1;transform:rotate(var(--a)) translateX(0)}to{opacity:0;transform:rotate(var(--a)) translateX(44px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(min-width:900px){.side{display:flex}.bottom{display:none}main{padding:40px 36px}.toast{bottom:32px}}
</style>
<script>
/* Aplica o tema salvo ANTES da primeira pintura (evita o flash do tema errado). */
(function(){var r=document.documentElement,p='auto',d=false;
try{p=localStorage.getItem('viva-theme')||'auto';if(p!=='light'&&p!=='dark')p='auto'}catch(e){}
try{d=p==='dark'||(p==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}
r.dataset.themePref=p;r.dataset.theme=d?'dark':'light';r.style.colorScheme=d?'dark':'light';
var m=document.getElementById('tcolor');if(m)m.content=getComputedStyle(r).getPropertyValue('--background').trim()})();
</script>

 editGoal:id=>goalModal(db.goals.find(x=>x.id==id)),
 saveGoal:async id=>{const t=$v('gt'),k=GT[t].k,title=$v('gti').trim(),tg=parseFloat($v('gta')),old=id&&db.goals.find(x=>x.id==id);
  if(!title)return bad('gti','Dê um título à meta');if(isNaN(tg)||tg<=0)return bad('gta','Informe o valor desejado');
  const metric=t==='medida'?$v('gme'):null;let st=0;
  if(k==='val'){const sv=$v('gst');if(sv!=='')st=parseFloat(sv);else{const cur=t==='peso'?(db.wlogs.at(-1)?.w??db.p.current_weight):db.mraw.filter(x=>x.type===metric).at(-1)?.v;if(cur==null)return toast('Informe o valor inicial ou registre o valor atual antes');st=+cur}}
  else if(k==='man'){const sv=$v('gst');st=sv===''?0:parseFloat(sv)}
  if(k!=='cnt'&&st===tg)return toast('O valor inicial e o desejado precisam ser diferentes');
  const row={type:t,title,description:$v('gde').trim()||null,metric,unit:t==='personalizada'?($v('gun').trim()||null):GT[t].u,start_value:st,target_value:tg,deadline:$v('gdl')||null};
  if(old&&old.status==='concluida'){row.status='ativa';row.completed_on=null}
  if(!old){row.start_date=today();row.status='ativa'}
  if(!await putGoal(row,id))return;
  A.close();render(true);toast(id?'Meta atualizada':'Meta criada 🌿');
  if(t==='peso'&&row.deadline){const wks=Math.max(1,(new Date(row.deadline+'T12:00')-new Date(today()+'T12:00'))/6048e5);if(Math.abs(st-tg)/wks>1)setTimeout(()=>toast('Esse ritmo é mais acelerado do que costuma ser sustentável. Considere um prazo maior.',6000,'warn'),2300)}},
 pauseGoal:async id=>{const g=db.goals.find(x=>x.id==id);if(!g)return;const on=g.status!=='pausada';if(await putGoal({status:on?'pausada':'ativa'},id)){render(true);toast(on?'Meta em pausa — retome quando quiser':'Meta retomada')}},
 delGoal:async id=>{if(typeof confirm==='function'&&!confirm('Remover esta meta?'))return;if(sb){if(!ok(await sb.from('goals').delete().eq('id',id)))return;await load(['gl'])}else db.goals=db.goals.filter(x=>x.id!=id);render(true);toast('Meta removida')},
 updGoal:id=>{const g=db.goals.find(x=>x.id==id);if(g)Modal('Atualizar progresso',Input('gcu','Valor atual'+(g.unit?' ('+g.unit+')':''),g.manual??g.start,'number')+Btn('Salvar','saveUpd','',id))},

 xday:x=>{xdate=x;render()},

  if(sb){if(!ok(await sb.from('workout_logs').delete().eq('id',id)))return;await load(['wo'])}else{db.L.work=db.L.work.filter(x=>x.id!=id);derive()}
  render();toast('Treino removido')},
 saveWorkout:async()=>{const c=$v('xt'),m=Math.round(+$v('xd')),day=$v('xdt');if(!day)return bad('xdt','Escolha a data');if(!(m>0&&m<=600))return bad('xd','Informe a duração em minutos');

  ex=c==='musculacao'?[...document.querySelectorAll('#layer .exr')].map((r,i)=>({name:vv(r,'.xn').trim(),sets:+vv(r,'.xs')||null,reps:+vv(r,'.xr')||null,weight_kg:vv(r,'.xk')===''?null:+vv(r,'.xk'),note:vv(r,'.xo').trim()||null,position:i})).filter(x=>x.name):[];

 if(sb){const r=await sb.from('workout_logs').insert({user_id:me.id,logged_on:day,...row}).select().single();if(!ok(r))return;

  await load(['wo'])}
 else{db.L.work.push({id:'l'+Date.now(),d:day,...row,workout_exercises:ex});derive()}
 A.close();render();toast('Treino registrado ⚡')},
 addHabit:()=>habitModal(null),

  const f=$v('hf'),ds=f==='personalizado'?[...document.querySelectorAll('#hds input:checked')].map(x=>+x.value):DAYS[f];if(!ds.length)return toast('Escolha ao menos um dia');

 addWeight:()=>Modal('Registrar peso',Input('wk','Peso (kg)','','number')+Input('wd','Data',today(),'date')+Input('wn','Observação (opcional)')+Btn('Salvar','saveWeight')),
 saveWeight:async()=>{const v=+$v('wk');if(!$v('wd'))return bad('wd','Escolha a data.');if(!(v>=20&&v<=500))return bad('wk','Informe um peso entre 20 e 500 kg.');
  if(sb){if(!ok(await sb.from('weight_logs').insert({user_id:me.id,logged_on:$v('wd'),weight:v,note:$v('wn')||null})))return;
   await sb.from('profiles').update({current_weight:v,...(db.p.start_weight==null?{start_weight:v}:{})}).eq('id',me.id);await load(['w','p'])}
  else{db.wlogs.push({d:$v('wd'),w:v});db.wlogs.sort((a,b)=>a.d<b.d?-1:1);db.weight=db.wlogs.map(x=>x.w);db.p.current_weight=db.weight.at(-1)}
  A.close();render();toast('Peso registrado')},

 saveMeasure:async()=>{const v=+$v('mv');if(!$v('md2'))return bad('md2','Escolha a data.');if(!(v>=5&&v<=300))return bad('mv','Informe uma medida entre 5 e 300 cm.');

 saveProfile:async()=>{const n=x=>$v(x)===''?null:+$v(x);
  const p={name:$v('pn'),age:n('pa'),height_cm:n('ph'),start_weight:n('ps'),goal_weight:n('pg'),objective:$v('po'),activity_level:$v('pl'),water_goal_ml:n('pw')||2000,sleep_goal_h:n('pz')||8,exercise_per_week:n('pe')??3,journey_start:$v('pj')||null};
  const bd=(v,a,b)=>v!=null&&!(v>=a&&v<=b);if(bd(p.age,10,120)||bd(p.height_cm,80,250)||bd(p.start_weight,20,500)||bd(p.goal_weight,20,500)||bd(p.water_goal_ml,500,10000)||bd(p.sleep_goal_h,3,14)||bd(p.exercise_per_week,0,14))return toast('Confira os valores: algum está fora do intervalo permitido.',5000);

 authMode:m=>{authMode=m;showAuth()},

 signup:async()=>{if(!$v('ae').trim())return bad('ae','Informe seu e-mail.');if($v('ap').length<6)return bad('ap','A senha precisa ter pelo menos 6 caracteres.');const r=await sb.auth.signUp({email:$v('ae'),password:$v('ap'),options:{data:{name:$v('an')}}});if(!ok(r))return;if(r.data.session)await enter(r.data.session);else{authMode='login';showAuth();toast('Confirme seu e-mail para entrar')}},

 newpass:async()=>{if($v('ap').length<6)return bad('ap','A senha precisa ter pelo menos 6 caracteres.');if(ok(await sb.auth.updateUser({password:$v('ap')}))){authMode='login';const {data}=await sb.auth.getSession();await enter(data.session);toast('Senha atualizada')}},
 logout:async()=>{await sb.auth.signOut();authMode='login';fdate=wdate=sdate=xdate=null;wkOff=0;db=fresh();await enter(null)}};
let busy=false,busyT=0;
const run=(act,arg,el)=>{if(!A[act]||(busy&&act!=='close'&&act!=='skip'))return;const r=A[act](arg,el);
 if(r&&typeof r.then==='function'){busy=true;document.body.classList.add('busy');const done=()=>{busy=false;clearTimeout(busyT);document.body.classList.remove('busy')};clearTimeout(busyT);busyT=setTimeout(done,15000);r.catch(e=>{console.error(e);toast('Algo deu errado. Tente novamente.',5000)}).finally(done)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.type==='checkbox'||(t.classList.contains('ov')&&e.target!==t))return;run(t.dataset.act,t.dataset.arg,t)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#layer .ov')){e.preventDefault();A.close();return}
 if(e.key==='Tab'){const m=$('#layer .modal');if(m){const fs=[...m.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(x=>x.getClientRects().length);if(fs.length){const a=fs[0],z=fs.at(-1),c=document.activeElement;if(e.shiftKey&&(c===a||c===m)){e.preventDefault();z.focus()}else if(!e.shiftKey&&c===z){e.preventDefault();a.focus()}}}}
 if(e.key==='Enter'&&!e.isComposing&&e.target.tagName==='INPUT'&&!['checkbox','radio','button','file'].includes(e.target.type)){const sc=e.target.closest('.modal,.auth'),b=sc&&sc.querySelector('.btn:not(.soft)');if(b){e.preventDefault();b.click()}}});
document.addEventListener('change',e=>{if(e.target.type==='checkbox'&&e.target.dataset.act)run(e.target.dataset.act,e.target.dataset.arg,e.target)});
document.addEventListener('click',e=>{if(e.target.closest('#layer a'))A.close()});
document.addEventListener('change',e=>{if(e.target.id==='gt')gtype();if(e.target.id==='hf')$('#hds').style.display=e.target.value==='personalizado'?'flex':'none';if(e.target.id==='xt')$('#exsec').style.display=e.target.value==='musculacao'?'block':'none'});
document.addEventListener('input',e=>{if(e.target.id==='sbed'||e.target.id==='swake')updDur()});
addEventListener('hashchange',()=>{fdate=wdate=sdate=xdate=null;render().then(()=>{const m=$('#main');if(m)m.focus({preventScroll:true})})});
(()=>{const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(themePref()==='auto')applyTheme('auto')});
 addEventListener('storage',e=>{if(e.key==='viva-theme'||e.key===null){applyTheme(themePref());syncSwitches()}});applyTheme(themePref())})();
document.addEventListener('input',e=>{const t=e.target;if(t&&t.getAttribute&&t.getAttribute('aria-invalid'))t.removeAttribute('aria-invalid')});
if(!sb)render();else{
 sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){authMode='newpass';document.body.classList.add('noauth');showAuth()}else if(ev==='SIGNED_OUT'&&me){db=fresh();enter(null)}});
 sb.auth.getSession().then(({data})=>enter(data.session));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&Date.now()-lastLoad>60000)load().then(()=>render(true))})}
